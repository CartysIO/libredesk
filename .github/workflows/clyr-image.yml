name: Clyr image

on:
  push:
    branches: [clyr]
  pull_request:
    branches: [clyr]
  workflow_dispatch:

concurrency:
  group: clyr-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: github.ref == 'refs/heads/clyr' && github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Version
        id: version
        run: echo "value=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile.clyr
          platforms: linux/amd64
          push: ${{ github.ref == 'refs/heads/clyr' && github.event_name != 'pull_request' }}
          build-args: LIBREDESK_VERSION=${{ steps.version.outputs.value }}
          tags: |
            ghcr.io/cartysio/libredesk:clyr
            ghcr.io/cartysio/libredesk:clyr-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Pull fresh :clyr from GHCR on each push to clyr (see deploy/clyr-railway.md for setup).
  deploy-staging:
    name: Railway staging
    needs: image
    if: github.ref == 'refs/heads/clyr' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    container: ghcr.io/railwayapp/cli:latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_STAGING }}
    steps:
      - name: Redeploy Libredesk
        if: env.RAILWAY_TOKEN != ''
        run: |
          railway redeploy -y --from-source \
            -p 86f4a5dc-54b6-43b3-ad04-f88f0fd77916 \
            -e staging \
            -s Libredesk
      - name: Skip (no token)
        if: env.RAILWAY_TOKEN == ''
        run: |
          echo "::warning::RAILWAY_TOKEN_STAGING is not set. See deploy/clyr-railway.md"

  deploy-production:
    name: Railway production
    needs: deploy-staging
    if: github.ref == 'refs/heads/clyr' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    container: ghcr.io/railwayapp/cli:latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_PRODUCTION }}
    steps:
      - name: Redeploy Libredesk
        if: env.RAILWAY_TOKEN != ''
        run: |
          railway redeploy -y --from-source \
            -p 86f4a5dc-54b6-43b3-ad04-f88f0fd77916 \
            -e production \
            -s Libredesk
      - name: Skip (no token)
        if: env.RAILWAY_TOKEN == ''
        run: |
          echo "::warning::RAILWAY_TOKEN_PRODUCTION is not set. See deploy/clyr-railway.md"
